<!--
  Знак в трее, не подключено. Тот же неон, что в окне, но без подложки: в трее
  фон чужой — светлая панель у одних, тёмная у других, — и собственная плашка
  выглядела бы наклейкой поверх панели.

  Штрихов уровня здесь нет и свечения тоже: у знака шестнадцать пикселей, и
  всё, что мельче трёх единиц холста, превращается в шум. Остаётся кольцо и
  литера — по ним знак и узнают.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <circle cx="256" cy="256" r="206" fill="none" stroke="#8A7A80" stroke-width="40"/>

  <g transform="translate(256 256) scale(11.6) translate(-12 -10.75)"
     fill="none" stroke="#8A7A80" stroke-width="3.1"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5,17.5 L4.5,4 L12,12.4 L19.5,4 L19.5,17.5"/>
  </g>
</svg>
