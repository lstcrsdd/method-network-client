<!--
  Ступень для мелких размеров: 16–24 px.

  Здесь у знака шестнадцать пикселей на всё, и любая деталь мельче трёх единиц
  холста превращается в шум. Поэтому: ни свечения, ни полос, ни обводки.
  Остаётся то, по чему знак и узнают, — силуэт буквы на тёплом пятне заката.

  Солнце поднято и расширено: на 16 px от него видно только то, что выглядывает
  из-за литеры, и если оставить его на прежнем месте, наружу не выйдет ничего.
  Скругление подложки уменьшено — рамка в 100 единиц из 512 на таком размере
  съедает угол целиком, и квадрат перестаёт быть квадратом.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#4a1830"/>
    </linearGradient>

    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffc95e"/>
      <stop offset="100%" stop-color="#ff5a3c"/>
    </linearGradient>

    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22f0ff"/>
      <stop offset="100%" stop-color="#ff2a5f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="72" fill="url(#bgGrad)"/>

  <!-- Солнце убрано вовсе. На шестнадцати пикселях оно не читается как закат,
       зато забивает просветы литеры, и знак превращается в оранжевое пятно
       неясной формы. Узнают его тут по силуэту буквы, и всё, что не силуэт, —
       помеха. Тёплый тон остаётся в подложке. -->

  <!-- Буква толще и короче: тонкие ножки на 16 px пропадают через одну. -->
  <path d="M 96 404 L 96 116 L 188 116 L 256 240 L 324 116 L 416 116 L 416 404 L 330 404 L 330 246 L 286 326 L 226 326 L 182 246 L 182 404 Z"
        fill="url(#letterGrad)"/>
</svg>
