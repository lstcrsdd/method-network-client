<!--
  Ступень для мелких размеров: 16–24 px.

  Здесь у знака шестнадцать пикселей на всё, и любая деталь мельче трёх единиц
  холста превращается в шум. Поэтому ни свечения, ни сердцевины, ни штрихов
  уровня: они на таком размере не читаются, но забивают просветы литеры и
  превращают знак в оранжевую кляксу.

  Остаётся то, по чему знак узнают: кольцо и литера внутри. Кольцо подтянуто к
  краю и утолщено, литера — сплошным силуэтом вместо трубки: тонкая линия на
  16 px пропадает через пиксель.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B1422"/>
      <stop offset="100%" stop-color="#281724"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="72" fill="url(#bg)"/>

  <circle cx="256" cy="256" r="178" fill="none" stroke="#EE7A4E" stroke-width="32"/>

  <!-- Литера шире и короче обычной: узкая на 16 px сливается в столбик. -->
  <g transform="translate(256 256) scale(10.2) translate(-12 -10.75)"
     fill="none" stroke="#F6B79C" stroke-width="2.6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5,17.5 L4.5,4 L12,12.4 L19.5,4 L19.5,17.5"/>
  </g>
</svg>
