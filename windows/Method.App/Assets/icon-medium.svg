<!--
  Ступень для средних размеров: 32–64.

  Размытие здесь втрое слабее, чем на крупной ступени, и не потому, что так
  красивее: ореол задан в единицах холста 512, и на сорока восьми пикселях
  тринадцать единиц размытия накрывают знак целиком — вместо неона выходит
  оранжевое облако.

  Штрихи уровня оставлены, но стали толще: на 32 px линия в полторы единицы
  холста — это девятая часть пикселя, то есть её нет.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181320"/>
      <stop offset="100%" stop-color="#241520"/>
    </linearGradient>

    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="88" fill="url(#bg)"/>

  <!-- Кольцо ближе к краю и толще: на мелком размере тонкая окружность
       превращается в пунктир из-за сглаживания. -->
  <circle cx="256" cy="256" r="174" fill="none" stroke="#EE7A4E" stroke-width="22"
          opacity="0.4" filter="url(#halo)"/>
  <circle cx="256" cy="256" r="174" fill="none" stroke="#EE7A4E" stroke-width="15"/>
  <circle cx="256" cy="256" r="174" fill="none" stroke="#F9D0C1" stroke-width="5"/>

  <g transform="translate(256 256) scale(6.9) translate(-12 -15.1)"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4,17.5 L4,4 L12,12 L20,4 L20,17.5 M8.5,19.8 V23.6 M12,21.1 V26.2 M15.5,19.8 V23.6"
          stroke="#EE7A4E" stroke-width="3.6" opacity="0.45" filter="url(#halo)"/>
    <path d="M4,17.5 L4,4 L12,12 L20,4 L20,17.5 M8.5,19.8 V23.6 M12,21.1 V26.2 M15.5,19.8 V23.6"
          stroke="#EE7A4E" stroke-width="2.1"/>
    <path d="M4,17.5 L4,4 L12,12 L20,4 L20,17.5 M8.5,19.8 V23.6 M12,21.1 V26.2 M15.5,19.8 V23.6"
          stroke="#F9D0C1" stroke-width="0.75"/>
  </g>
</svg>
