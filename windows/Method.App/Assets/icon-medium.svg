<!--
  Ступень для средних размеров: 32–64 px.

  От полного вектора отличается тем, что убрано всё, чего на этих размерах не
  видно, а мешает оно вполне: внешняя белая обводка буквы (3 единицы холста —
  это четверть пикселя на 40 px, но она съедает край свечения), две из четырёх
  полос заката (на 32 px соседние сливаются в серое) и ореол под солнцем.
  Размытие уменьшено втрое: на 512 это ореол, на 40 — туман поверх знака.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1423"/>
      <stop offset="70%" stop-color="#1f1838"/>
      <stop offset="100%" stop-color="#5c1d38"/>
    </linearGradient>

    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="55%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff2a5f"/>
    </linearGradient>

    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="55%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#ff0844"/>
    </linearGradient>

    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="sunClip">
      <circle cx="256" cy="318" r="126"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Солнце меньше и ниже полного вектора: на 32 px диск в 150 единиц
       выходит за края литеры и спорит с ней за внимание. -->
  <circle cx="256" cy="318" r="126" fill="url(#sunGrad)"/>

  <g clip-path="url(#sunClip)" fill="#0f1423">
    <rect x="130" y="340" width="252" height="16"/>
    <rect x="130" y="396" width="252" height="26"/>
  </g>

  <!-- Буква чуть шире: на 32 px узкая середина смыкается и М читается как П. -->
  <path d="M 112 388 L 112 148 L 190 148 L 256 264 L 322 148 L 400 148 L 400 388 L 330 388 L 330 250 L 280 338 L 232 338 L 182 250 L 182 388 Z"
        fill="url(#letterGrad)"
        filter="url(#glow)"/>
</svg>
