<!--
  Знак приложения: то же, что человек видит в окне, — неоновое кольцо, тёмный
  диск и литера «М» со штрихами уровня под ней.

  Прежний знак был синтвейвом сам по себе: закат, полосы, холодная литера. Он
  был хорош, но жил отдельной жизнью от клиента, а знак на панели задач и знак
  на главном экране обязаны быть одним знаком. Цвета взяты из основного
  оформления: слива в подложке, закатный коралл в неоне.

  Свечение здесь набрано размытием, а не слоями обводок, как в самом клиенте:
  в SVG размытие есть, и спорить с ним незачем. Порядок тот же — широкий
  ореол, трубка, выбеленная сердцевина.

  Тёмного диска под литерой, в отличие от окна, нет. В окне он служит кнопкой,
  которую нажимают; здесь нажимать нечего, а лишняя фигура на значке в
  тридцать две точки — это пятно, съедающее просветы литеры.

  Ступень для крупных размеров: 128–256.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181320"/>
      <stop offset="100%" stop-color="#241520"/>
    </linearGradient>

    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>

    <filter id="haloTight" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Кольцо: ореол, трубка, сердцевина. -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#EE7A4E" stroke-width="26"
          opacity="0.45" filter="url(#halo)"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#EE7A4E" stroke-width="11"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#F9D0C1" stroke-width="4"/>

  <!--
    Литера и штрихи — тот же путь, что в клиенте, в тех же единицах. Середина
    пути (12; 15.1) ставится в середину холста, дальше масштаб.
  -->
  <g transform="translate(256 256) scale(7.8) translate(-12 -15.1)"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4,17.5 L4,4 L12,12 L20,4 L20,17.5 M8.5,19.8 V23.6 M12,21.1 V26.2 M15.5,19.8 V23.6"
          stroke="#EE7A4E" stroke-width="3.6" opacity="0.6" filter="url(#haloTight)"/>
    <path d="M4,17.5 L4,4 L12,12 L20,4 L20,17.5 M8.5,19.8 V23.6 M12,21.1 V26.2 M15.5,19.8 V23.6"
          stroke="#EE7A4E" stroke-width="1.55"/>
    <path d="M4,17.5 L4,4 L12,12 L20,4 L20,17.5 M8.5,19.8 V23.6 M12,21.1 V26.2 M15.5,19.8 V23.6"
          stroke="#F9D0C1" stroke-width="0.55"/>
  </g>
</svg>
