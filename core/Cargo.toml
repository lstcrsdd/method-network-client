[workspace]
resolver = "2"
members = ["method-core", "method-core-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"

[profile.release]
lto = true
codegen-units = 1
# Разворачивание паники, а НЕ abort. Здесь было `panic = "abort"`, и с ним
# граница C была бы беззащитна: `catch_unwind` не ловит abort — процесс просто
# умирает. Настройка профиля в Cargo общая на всё рабочее пространство и на
# отдельный крейт не задаётся, поэтому выбор один на всех.
#
# Цена abort в нашем случае — не «падение оркестратора», а падение ВСЕГО
# приложения вместе с контуром, который держит туннель: арифметическая
# неожиданность в оценке маршрута уронила бы клиент целиком. Цена unwind —
# посадочные площадки в коде и несколько процентов размера бинаря. Мы платим
# размером.
panic = "unwind"
